name: Literature PDF Production Gates

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/supertranslate/**'
      - 'docker-compose*literature*'
      - 'docker-compose.supertranslate.yml'
      - 'backend/package/yuxi/literature/**'
      - 'backend/package/yuxi/storage/postgres/**'
      - 'backend/server/routers/literature*'
      - 'backend/test/**/literature/**'
      - 'backend/test/e2e/test_literature_pdf_acceptance.py'
      - 'backend/test/integration/test_native*'
      - 'web/src/components/literature/**'
      - 'web/src/apis/literature_api.js'
      - '.github/workflows/literature-pdf.yml'

permissions:
  contents: read
concurrency:
  group: literature-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Locked frontend build and lifecycle regression
        run: |
          docker build --target development -f docker/web.Dockerfile -t yuxi-web:pdf-ci .
          docker run --rm --network none yuxi-web:pdf-ci sh -c 'pnpm exec eslint src/components/literature/LiteraturePdfOperations.vue src/components/literature/LiteraturePdfWorkspace.vue src/components/literature/LiteratureSettingsPanel.vue src/apis/literature_api.js && for spec in $(find src -name "*.spec.js" -type f | sort); do node "$spec" || exit 1; done && pnpm run build'
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build from checked-in source, locked dependencies and contract
        run: |
          docker build -f docker/api.Dockerfile -t yuxi-api:pdf-ci .
          docker build -f docker/supertranslate/Dockerfile -t yuxi-supertranslate:pdf-ci .
      - name: Governed calls, immutable settlement, critical tokens and subprocess lifecycle
        run: |
          docker run --rm --network none -v "$PWD/backend/test:/app/test:ro" --entrypoint uv yuxi-api:pdf-ci run --no-sync --group test pytest test/unit/literature/ test/unit/storage/test_postgres_manager_schema.py -q
          docker run --rm --user 0 -v "$PWD/backend/test:/tests:ro" -e PYTHONPATH=/opt/integration:/opt/source/upstream --entrypoint sh yuxi-supertranslate:pdf-ci -c 'uv sync --locked --group test --no-install-project && .venv/bin/pytest --confcutdir=/tests/integration/literature -c /opt/integration/pyproject.toml /tests/integration/literature/test_pdf_runtime.py -q'
      - name: Encrypted isolated recovery without production access
        run: |
          docker pull python:3.13-slim
          docker pull postgres:17-alpine
          docker run --rm --network none -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/backend/test:/app/test:ro" -e YUXI_NATIVE_RECOVERY_TEST=1 --entrypoint uv yuxi-api:pdf-ci run --no-sync --group test pytest --confcutdir=test/integration test/integration/test_native_recovery_fixture.py test/integration/test_native_postgres_restore.py -q
      - name: Start isolated PostgreSQL without public ports
        run: |
          docker network create --internal --label yuxi.pdf-fixture=true pdf-production-fixture-ci-net
          docker run -d --name pdf-production-fixture-ci-pg --label yuxi.pdf-fixture=true --network pdf-production-fixture-ci-net --network-alias pdf-postgres -e POSTGRES_USER=fixture -e POSTGRES_DB=pdf_fixture -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 40); do
            if docker exec pdf-production-fixture-ci-pg pg_isready -U fixture -d pdf_fixture; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real RLS, pool reuse, schema denial and ledger protection
        run: |
          docker run --rm --network pdf-production-fixture-ci-net -v "$PWD/backend/test:/app/test:ro" -e YUXI_PDF_SECURITY_FIXTURE=1 -e YUXI_PDF_SECURITY_DATABASE_URL=postgresql+asyncpg://fixture@pdf-postgres:5432/pdf_fixture --entrypoint uv yuxi-api:pdf-ci run --no-sync --group test pytest --confcutdir=test/integration/literature test/integration/literature/test_production_security.py -q
      - name: Cleanup only labelled fixtures
        if: always()
        run: |
          if docker inspect pdf-production-fixture-ci-pg >/dev/null 2>&1; then
            test "$(docker inspect -f '{{index .Config.Labels "yuxi.pdf-fixture"}}' pdf-production-fixture-ci-pg)" = true
            docker rm -f -v pdf-production-fixture-ci-pg
          fi
          if docker network inspect pdf-production-fixture-ci-net >/dev/null 2>&1; then
            test "$(docker network inspect -f '{{index .Labels "yuxi.pdf-fixture"}}' pdf-production-fixture-ci-net)" = true
            docker network rm pdf-production-fixture-ci-net
          fi
