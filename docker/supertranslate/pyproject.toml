[project]
name = "yuxi-supertranslate-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=44",
    "pymupdf==1.25.2", "fonttools>=4.58", "pillow>=11", "numpy>=2.2",
]

[dependency-groups]
test = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
markers = ["integration: isolated runtime contract tests"]
