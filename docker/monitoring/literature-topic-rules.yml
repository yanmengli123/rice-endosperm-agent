groups:
  - name: yuxi-literature-topics
    rules:
      - alert: LiteratureTopicNotProductionReady
        expr: yuxi_topic_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BERTopic 数据库、对象隐私或 worker 准入未通过"
      - alert: LiteratureTopicQueueDelayed
        expr: yuxi_topic_oldest_pending_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BERTopic 最旧待处理任务已等待超过 10 分钟"
      - alert: LiteratureTopicMonitoringUnavailable
        expr: up{job="yuxi-topic"} == 0 or absent(yuxi_topic_ready)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BERTopic 监控端点不可用或未采集"
