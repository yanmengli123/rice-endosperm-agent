[project]
name = "yuxi-topic-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bertopic==0.17.4",
  "umap-learn==0.5.12",
  "hdbscan==0.8.44",
  "scikit-learn==1.8.0",
  "jieba==0.42.1",
  "safetensors==0.7.0",
  "matplotlib==3.10.8",
  "wordcloud==1.9.6",
  "torch==2.12.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
