            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      request-validation:
        body_schema:
          type: object
          required:
            - run_id
            - agent_slug
          properties:
            run_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
            agent_slug:
              type: string
              pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          additionalProperties: false
        rejected_code: 400
        rejected_msg: invalid request
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
