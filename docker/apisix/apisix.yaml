upstreams:
  - id: yuxi-backend
    type: roundrobin
    scheme: http
    nodes:
      "api:5050": 1
    timeout:
      connect: 5
      send: 30
      read: 300

  # 附件上传/解析专用：大文件传输与 PDF 解析耗时远超常规 API 超时。
  - id: yuxi-backend-attachment
    type: roundrobin
    scheme: http
    nodes:
      "api:5050": 1
    timeout:
      connect: 5
      send: 300
      read: 600

routes:
  - id: yuxi-public-credential-status
    name: yuxi-public-credential-status
    uri: /api/agent-invocation/credential-status
    methods:
      - GET
    priority: 120
    upstream_id: yuxi-backend
    plugins:
      request-id:
        header_name: X-Gateway-Trace-ID
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        headers:
          remove:
            - X-Consumer-Username
            - X-Credential-Identifier
            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
        rejected_code: 429
        show_limit_quota_header: true
        # 认证仍由 Yuxi 强制执行；Redis 短暂不可用时只跳过限流，
        # 避免限流基础设施把有效凭证错误地变成 HTTP 500。
        allow_degradation: true

  # 渠道平台回调（匿名）：认证 = 平台验签 + 路径随机段（上游 channel_router）。
  # 平台对非 2xx 会重试，限流阈值放宽；GET 用于企微/公众号首次 URL 校验。
  # 每平台显式声明（不使用通配渠道段），与网关白名单哲学一致。
  - id: yuxi-public-channel-webhook-feishu
    name: yuxi-public-channel-webhook-feishu
    uri: /api/channels/feishu/webhook/*
    methods:
      - GET
      - POST
    priority: 130
    upstream_id: yuxi-backend
    plugins:
      request-id:
        header_name: X-Gateway-Trace-ID
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        headers:
          remove:
            - X-Consumer-Username
            - X-Credential-Identifier
            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
        rejected_code: 429
        show_limit_quota_header: true
        allow_degradation: true

