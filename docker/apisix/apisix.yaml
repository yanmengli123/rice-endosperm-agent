  - id: yuxi-desktop-native-run-create
    name: yuxi-desktop-native-run-create
    uri: /api/agent/runs
    methods:
      - POST
    priority: 120
    upstream_id: yuxi-backend
    plugins:
      request-id:
        header_name: X-Gateway-Trace-ID
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        headers:
          remove:
            - X-Consumer-Username
            - X-Credential-Identifier
            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      request-validation:
        body_schema:
          type: object
          required:
            - agent_slug
            - thread_id
            - meta
          properties:
            query:
              type: string
              minLength: 1
              maxLength: 20000
            agent_slug:
              type: string
              pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
            thread_id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]+$"
            meta:
              type: object
              required:
                - request_id
              properties:
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 64
                  pattern: "^[A-Za-z0-9._:-]+$"
                client:
                  type: string
                  enum:
                    - rice-endosperm-desktop
                attachment_file_ids:
                  type: array
                  maxItems: 6
                  items:
                    type: string
                    maxLength: 128
              additionalProperties: false
            model_spec:
              type: string
              minLength: 1
              maxLength: 200
            # 与服务端 AgentRunCreate 对齐（base64 图片输入）；闭集 schema
            # 漏声明会被网关 400（由 test_apisix_gateway_contract 漂移检查锁定）。
            image_content:
              type: string
            # 中断恢复（P1）：载荷结构由 LangGraph 定义，网关只做存在性放行，
            # 字段校验由上游 AgentRunCreate（agent_router.py）承担。
            resume: {}
            created_by_run_id:
              type: string
              minLength: 1
              maxLength: 64
            # mention.v2 结构化提及：解析/鉴权/冻结由上游承担，网关只放行
            # 形状（mentions 元素结构与 query @ token 一致性由服务端 422 裁决）。
            mention_protocol:
              type: string
              enum:
                - mention.v2
            mentions:
              type: array
              maxItems: 20
              items:
                type: object
            # 本机浏览器开关：冻结/门控/配对校验由上游 AgentRunCreate 承担。
            browser_enabled:
              type: boolean
          # query 与 resume 二选一：resume run（人工审批续跑）不带 query。
          anyOf:
            - required:
                - query
            - required:
                - resume
          additionalProperties: false
        rejected_code: 400
        rejected_msg: invalid request
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
        rejected_code: 429
        show_limit_quota_header: true
        allow_degradation: true

