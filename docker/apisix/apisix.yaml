  - id: yuxi-public-agent-create
    name: yuxi-public-agent-create
    uri: /api/agent-invocation/agent-call/runs
    methods:
      - POST
    priority: 100
    upstream_id: yuxi-backend
    plugins:
      request-id:
        header_name: X-Gateway-Trace-ID
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        headers:
          remove:
            - X-Consumer-Username
            - X-Credential-Identifier
            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      request-validation:
        body_schema:
          type: object
          required:
            - agent_slug
            - messages
            - request_id
            - async_mode
          properties:
            agent_slug:
              type: string
              pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
            messages:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required:
                  - role
                  - content
                properties:
                  role:
                    type: string
                    enum:
                      - user
                  content:
                    type: string
                    minLength: 1
                    maxLength: 20000
                additionalProperties: false
            thread_id:
              type: string
              minLength: 1
              maxLength: 128
            model_spec:
              type: string
              minLength: 1
              maxLength: 200
            request_id:
              type: string
              minLength: 16
              maxLength: 64
              pattern: "^[A-Za-z0-9._:-]+$"
            async_mode:
              type: boolean
              enum:
                - true
          additionalProperties: false
        rejected_code: 400
        rejected_msg: invalid request
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
        rejected_code: 429
        show_limit_quota_header: true
        allow_degradation: true

