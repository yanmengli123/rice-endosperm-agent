  # 仅放行 GET；身份/租户/归属校验全部由上游 resolve_asset 承担，未授权/伪造/
  # 缺失资产一律 404（防枚举）。asset 段用 /* 通配承载文件名（含扩展名）。
  - id: yuxi-desktop-knowledge-asset
    name: yuxi-desktop-knowledge-asset
    uri: /api/knowledge/databases/:kb_id/documents/:file_id/revisions/:revision_id/assets/*
    methods:
      - GET
    priority: 120
    upstream_id: yuxi-backend
    plugins:
      request-id:
        header_name: X-Gateway-Trace-ID
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        headers:
          remove:
            - X-Consumer-Username
            - X-Credential-Identifier
            - X-Yuxi-Key-ID
            - X-Yuxi-User-ID
            - X-Yuxi-Tenant-ID
            - X-User-ID
            - X-Authenticated-User
            - X-Authenticated-Tenant
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis
        redis_host: redis
        redis_port: 6379
        redis_database: 3
        rejected_code: 429
        show_limit_quota_header: true
        allow_degradation: true

