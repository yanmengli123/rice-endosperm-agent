# Complete allowlist tree, applied to an empty custom profile (never sdk/base).
- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: yuxi-qa
    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false
    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'
    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'
    - id: filesystem
      name: '@deepseek-ai/dsh-fs-local'
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
      config:
        maxImageBytes: 4194304
        maxMessageImageBytes: 4194304
        maxImagesPerMessage: 4
    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? ''
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.DSH_HOME + '/sessions'
        compression: none
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          yuxi-gateway:
            apiKeyEnv: YUXI_DSH_GATEWAY_TOKEN
            api: openai-completions
            retryPolicy:
              mode: normal
              maxRetries: 2
            defaultInput: [text, image]
            compat:
              supportsUsageInStreaming: true
              supportsFinishReason: true
              supportsDeveloperRole: false
              requiresReasoningContentOnAssistantMessages: true
              maxTokensField: max_tokens
            baseURL: !!js process.env.YUXI_LLM_GATEWAY_URL
            models:
              - id: !!js process.env.YUXI_DSH_MODEL_ID
                contextWindow: !!js Number(process.env.YUXI_DSH_MODEL_CONTEXT_WINDOW)
    - id: yuxi-bridge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: yuxi
        transport: stdio
        command: !!js process.env.YUXI_DSH_BRIDGE_PYTHON
        args: !!js '[process.env.YUXI_DSH_BRIDGE_SCRIPT]'
        env: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: true
