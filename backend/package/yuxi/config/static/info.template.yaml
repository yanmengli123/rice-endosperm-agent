# 单位信息配置文件
# 用于配置网站的基本信息、品牌信息等
# 本文件为默认模板；本地覆盖请创建 info.local.yaml，
# 或通过 YUXI_BRAND_FILE_PATH 指定品牌配置文件。

# 组织信息
organization:
  name: "稻芯智析"           # 完整组织名称
  logo: "/brand/rice-endosperm/indexlogo.png"  # Logo 文件路径（放在 web/public 目录下）
  avatar: "/brand/rice-endosperm/indexlogo.png"  # 头像/导航栏图标路径（放在 web/public 目录下）
  login_bg: "/brand/rice-endosperm/indexlogo.png"  # 登录背景图片路径（放在 web/public 目录下）

# 项目信息
branding:
  name: "稻芯智析"
  title: "从基因到证据，理解水稻胚乳发育"     # 系统标题
  subtitle: "面向水稻胚乳发育、灌浆调控与组学分析的科研智能问答平台"          # 副标题（subtitles 为空时使用）
  subtitles:
    - "聚焦水稻胚乳发育、籽粒灌浆与品质形成"
    - "连接基因、表达、调控通路与来源文献"
    - "区分实验结果、关联证据与模型推断"

# 页脚信息
footer:
  copyright: "© 稻芯智析 2026 v{{YUXI_VERSION}}"
  user_agreement_url: "/protocols/user-agreement.template.html"
  privacy_policy_url: "/protocols/privacy-policy.template.html"
