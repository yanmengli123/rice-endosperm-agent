# docker compose -f docker-compose.yml -f docker-compose.supertranslate.yml up -d --build supertranslate pdf-worker
services:
  api:
    environment:
      SUPER_TRANSLATE_URL: http://supertranslate:8000
      SUPER_TRANSLATE_TOKEN: ${SUPER_TRANSLATE_TOKEN:?Configure SUPER_TRANSLATE_TOKEN}
    networks: [app-network, pdf-network]
  pdf-worker:
    image: yuxi-api:${YUXI_VERSION:-0.7.1}
    container_name: literature-pdf-worker
    restart: unless-stopped
    working_dir: /app
    env_file: [.env]
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yuxi}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_URI: ${MINIO_URI:-http://minio:9000}
      SUPER_TRANSLATE_URL: http://supertranslate:8000
      SUPER_TRANSLATE_TOKEN: ${SUPER_TRANSLATE_TOKEN:?Configure SUPER_TRANSLATE_TOKEN}
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./backend/package:/app/package:ro
      - ./backend/test:/app/test:ro
      - ./docker/volumes/yuxi:/app/saves
      - ./.env:/app/.env:ro
    command: uv run --no-sync --no-dev arq yuxi.literature.pdf_worker.WorkerSettings
    mem_limit: 2g
    networks: [app-network, pdf-network]
    healthcheck:
      test: [CMD, arq, yuxi.literature.pdf_worker.WorkerSettings, --check]
      interval: 30s
      timeout: 10s
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      supertranslate: {condition: service_healthy}
  supertranslate:
    build:
      context: .
      dockerfile: docker/supertranslate/Dockerfile
      additional_contexts:
        supertranslate: ${SUPER_TRANSLATE_SOURCE:-../super_translate-main}
    image: yuxi-supertranslate:1.0.0
    container_name: yuxi-supertranslate
    restart: unless-stopped
    environment:
      SUPER_TRANSLATE_TOKEN: ${SUPER_TRANSLATE_TOKEN:?Configure SUPER_TRANSLATE_TOKEN}
      PDF_GATEWAY_URL: http://api:5050/api/internal/literature-pdf/v1
      NO_PROXY: api,supertranslate,localhost,127.0.0.1
      no_proxy: api,supertranslate,localhost,127.0.0.1
    volumes: [supertranslate-data:/data]
    networks: [pdf-network]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/health]
      interval: 30s
      timeout: 10s
      start_period: 30s
networks:
  pdf-network:
    internal: true
volumes:
  supertranslate-data:
