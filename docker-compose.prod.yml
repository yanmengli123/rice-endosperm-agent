x-api-worker-env: &api-worker-env
  HOST_IP: ${HOST_IP:-}
  LITE_MODE: ${LITE_MODE:-}
  RUNNING_IN_DOCKER: "true"
  YUXI_ENV: production
  YUXI_DEPLOYMENT_REVISION: ${YUXI_DEPLOYMENT_REVISION:-}
  YUXI_PUBLIC_WEB_URL: ${YUXI_PUBLIC_WEB_URL:-http://localhost}
  ALLOW_DEVELOPMENT_MCP_RUNTIME: "false"
  YUXI_MCP_ALLOW_INSECURE_HTTP: "false"
  YUXI_MCP_BUILDER_URL: ${YUXI_MCP_BUILDER_URL:-}
  YUXI_MCP_BUILDER_TOKEN: ${YUXI_MCP_BUILDER_TOKEN:-}
  YUXI_MCP_RUNTIME_URL: ${YUXI_MCP_RUNTIME_URL:-}
  YUXI_MCP_RUNTIME_TOKEN: ${YUXI_MCP_RUNTIME_TOKEN:-}
  YUXI_BIOCOMPUTE_BROKER_URL: ${YUXI_BIOCOMPUTE_BROKER_URL:-}
  YUXI_BIOCOMPUTE_BROKER_TOKEN: ${YUXI_BIOCOMPUTE_BROKER_TOKEN:-}
  PYTHONPATH: /app/package
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.prod}
  # 敏感凭据静态加密主密钥（AES-256-GCM，secret_crypto.py）：生产必填，缺失即拒绝启动。
  YUXI_SECRET_MASTER_KEY: ${YUXI_SECRET_MASTER_KEY:?请在 .env 配置主密钥}
  YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?Set YUXI_INSTANCE_ID in .env.prod}
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-yuxi}}
  # LangGraph checkpointer 存储：prod 固定 postgres，构建失败直接终止启动（fail-closed）。
  LANGGRAPH_CHECKPOINTER_BACKEND: ${LANGGRAPH_CHECKPOINTER_BACKEND:-postgres}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
  RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
  YUXI_CORS_ORIGINS: ${YUXI_CORS_ORIGINS:-}
  NEO4J_URI: ${NEO4J_URI:-bolt://graph:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.prod}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
  PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
  MINIO_URI: ${MINIO_URI:-http://minio:9000}
  SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-provisioner}
  SANDBOX_PROVISIONER_URL: ${SANDBOX_PROVISIONER_URL:-http://sandbox-provisioner:8002}
  SANDBOX_PROVISIONER_TOKEN: ${SANDBOX_PROVISIONER_TOKEN:?Set SANDBOX_PROVISIONER_TOKEN in .env.prod}
  SANDBOX_VIRTUAL_PATH_PREFIX: ${SANDBOX_VIRTUAL_PATH_PREFIX:-/home/gem/user-data}
  SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
  SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
  NO_PROXY: localhost,127.0.0.1,milvus,graph,minio,milvus-etcd,etcd,mineru,paddlex,sandbox-provisioner,api.siliconflow.cn
  no_proxy: localhost,127.0.0.1,milvus,graph,minio,milvus-etcd,etcd,mineru,paddlex,sandbox-provisioner,api.siliconflow.cn

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        YUXI_DOCKERHUB_REGISTRY: ${YUXI_DOCKERHUB_REGISTRY:-docker.io}
    image: yuxi-api:${YUXI_VERSION:-0.7.1}
    container_name: ${YUXI_CONTAINER_PREFIX:-}api-prod
    working_dir: /app
    networks:
      - app-network
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/yuxi:/app/saves
      - ${YUXI_DATA_DIR:-./docker/volumes}/models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - "${YUXI_PROD_ENV_FILE:-.env.prod}"
    # region api_envs
    environment:
      <<: *api-worker-env
    # endregion api_envs
    command: uv run --no-sync --no-dev uvicorn server.main:app --host 0.0.0.0 --port 5050
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-provisioner:
        condition: service_healthy
      # Milvus 未就绪时 api 冷启动硬失败（知识库初始化），与 dev compose 一致等待 healthy。
      milvus:
        condition: service_healthy

  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: ${YUXI_CONTAINER_PREFIX:-}yuxi-apisix
    restart: unless-stopped
    ports:
      - "${APISIX_HTTP_BIND:-127.0.0.1}:${APISIX_HTTP_PORT:-9088}:9080"
    volumes:
      - ${YUXI_DEPLOY_CONFIG_DIR:-./docker}/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ${YUXI_DEPLOY_CONFIG_DIR:-./docker}/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      YUXI_PUBLIC_AGENT_SLUG: ${YUXI_PUBLIC_AGENT_SLUG:-default-chatbot}
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        YUXI_DOCKERHUB_REGISTRY: ${YUXI_DOCKERHUB_REGISTRY:-docker.io}
    image: yuxi-api:${YUXI_VERSION:-0.7.1}
    container_name: ${YUXI_CONTAINER_PREFIX:-}worker-prod
    working_dir: /app
    networks:
      - app-network
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/yuxi:/app/saves
      - ${YUXI_DATA_DIR:-./docker/volumes}/models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - "${YUXI_PROD_ENV_FILE:-.env.prod}"
    environment:
      <<: *api-worker-env
    command: uv run --no-sync --no-dev arq server.worker_main.WorkerSettings
    restart: unless-stopped
    healthcheck:
      # 与 dev 同款真健康检查（api/worker/channels 共用同一镜像）：
      # 锚定 ARQ 循环心跳文件（cron 每分钟写一次，容忍 200s）。原 TCP 探测 redis
      # 只证明 redis 可达，worker 进程卡死/ARQ 启动失败时容器仍「假健康」。
      test: ["CMD-SHELL", "python -c \"import os,time; assert time.time()-os.path.getmtime('/tmp/yuxi_worker_heartbeat')<200\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-provisioner:
        condition: service_healthy
      # 与 api/dev 一致：Milvus 未就绪时 worker 冷启动硬失败，等待 healthy 消除竞态。
      milvus:
        condition: service_healthy

  # 渠道网关运行时（与 dev compose 的 channels 同源）：持有长连接/轮询型入站
  # 传输（当前 Telegram getUpdates）。与 api/worker 共镜像、单副本运行
  # （每 app 一把 Redis 单活锁，败者 standby），扩容请扩 webhook 型平台。
  channels:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        YUXI_DOCKERHUB_REGISTRY: ${YUXI_DOCKERHUB_REGISTRY:-docker.io}
    image: yuxi-api:${YUXI_VERSION:-0.7.1}
    container_name: ${YUXI_CONTAINER_PREFIX:-}channels-prod
    working_dir: /app
    networks:
      - app-network
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/yuxi:/app/saves
      - ${YUXI_DATA_DIR:-./docker/volumes}/models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - "${YUXI_PROD_ENV_FILE:-.env.prod}"
    environment:
      <<: *api-worker-env
    command: uv run --no-sync --no-dev python -m server.channels_main
    restart: unless-stopped
    # 健康检查锚定运行时心跳文件（每 60s 刷新，容忍 200s）：
    # 「进程活着但监督/心跳循环卡死」也能被判出，而非只测 TCP 可达。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time; assert time.time()-os.path.getmtime('/tmp/channels_heartbeat')<200\""]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sandbox-provisioner:
    build:
      context: ./docker/sandbox_provisioner
      dockerfile: Dockerfile
      args:
        YUXI_DOCKERHUB_REGISTRY: ${YUXI_DOCKERHUB_REGISTRY:-docker.io}
    container_name: ${YUXI_CONTAINER_PREFIX:-}sandbox-provisioner
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/yuxi:/app/saves
      - ${YUXI_DEPLOY_CONFIG_DIR:-./docker}/sandbox_provisioner/sandbox.env:/app/sandbox.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Common provisioner settings
      - PROVISIONER_BACKEND=${SANDBOX_PROVISIONER_BACKEND:-docker}
      - PROVISIONER_PUBLIC_URL=${SANDBOX_PROVISIONER_URL:-http://sandbox-provisioner:8002}
      - SANDBOX_PROVISIONER_TOKEN=${SANDBOX_PROVISIONER_TOKEN:?Set SANDBOX_PROVISIONER_TOKEN in .env.prod}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
      - SANDBOX_CONTAINER_PORT=${SANDBOX_CONTAINER_PORT:-8080}
      - MEMORY_SANDBOX_URL_TEMPLATE=${MEMORY_SANDBOX_URL_TEMPLATE:-http://agent-sandbox:8000}
      - SANDBOX_HEALTH_TIMEOUT_SECONDS=${SANDBOX_HEALTH_TIMEOUT_SECONDS:-300}
      - SANDBOX_IDLE_TIMEOUT_SECONDS=${SANDBOX_IDLE_TIMEOUT_SECONDS:-120}
      - SANDBOX_IDLE_CHECK_INTERVAL_SECONDS=${SANDBOX_IDLE_CHECK_INTERVAL_SECONDS:-10}
      - SANDBOX_EXEC_TIMEOUT_SECONDS=${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      # Optional proxy for sandbox-provisioner container
      - HTTP_PROXY=${SANDBOX_HTTP_PROXY:-}
      - HTTPS_PROXY=${SANDBOX_HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      # Docker backend only
      - DOCKER_NETWORK_PREFIX=${SANDBOX_DOCKER_NETWORK_PREFIX:-yuxi-know-sandbox}
      - DOCKER_THREADS_HOST_PATH=${SANDBOX_DOCKER_THREADS_HOST_PATH:-}
      - DOCKER_SANDBOX_PREFIX=${SANDBOX_DOCKER_SANDBOX_PREFIX:-yuxi-sandbox}
      # Kubernetes backend only
      - K8S_NAMESPACE=${SANDBOX_K8S_NAMESPACE:-yuxi-know}
      - NODE_HOST=${SANDBOX_NODE_HOST:-host.docker.internal}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-}
      - THREAD_PVC=${THREAD_PVC:-yuxi-thread}
      - SKILLS_PVC=${SKILLS_PVC:-yuxi-skills}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        YUXI_DOCKERHUB_REGISTRY: ${YUXI_DOCKERHUB_REGISTRY:-docker.io}
      target: production
    image: yuxi-web:${YUXI_VERSION:-0.7.1}
    container_name: ${YUXI_CONTAINER_PREFIX:-}web-prod
    ports:
      - "${YUXI_WEB_BIND:-0.0.0.0}:${YUXI_WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - app-network
    environment:
      - NODE_ENV=production
      - VITE_LITE_MODE=${LITE_MODE:-}
    command: nginx -g "daemon off;"
    restart: unless-stopped

  graph:
    image: neo4j:5.26
    container_name: ${YUXI_CONTAINER_PREFIX:-}graph
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/neo4j/data:/data
      - ${YUXI_DATA_DIR:-./docker/volumes}/neo4j/logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.prod}
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - ENTITY_EMBEDDING=true
    networks:
      - app-network
    restart: unless-stopped

  etcd:
    container_name: ${YUXI_CONTAINER_PREFIX:-}milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  minio:
    container_name: ${YUXI_CONTAINER_PREFIX:-}minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.prod}
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/milvus/minio:/minio_data
      - ${YUXI_DATA_DIR:-./docker/volumes}/milvus/minio_config:/root/.minio
    command: minio server /minio_data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  milvus:
    image: ${YUXI_MILVUS_IMAGE:-milvusdb/milvus:v2.5.6}
    container_name: ${YUXI_CONTAINER_PREFIX:-}milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.prod}
      MILVUS_LOG_LEVEL: error
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/milvus/milvus:/var/lib/milvus
      - ${YUXI_DATA_DIR:-./docker/volumes}/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ${YUXI_CONTAINER_PREFIX:-}postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      - POSTGRES_DB=${POSTGRES_DB:-yuxi}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuxi} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${YUXI_CONTAINER_PREFIX:-}redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/redis:/data
    networks:
      - app-network
    restart: unless-stopped

  mineru-api:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: mineru-vllm:latest
    container_name: ${YUXI_CONTAINER_PREFIX:-}mineru-api
    profiles:
      - all
    env_file:
      - "${YUXI_PROD_ENV_FILE:-.env.prod}"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 30001
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30001/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

  paddlex:
    build:
      context: .
      dockerfile: docker/paddlex.Dockerfile
    image: paddlex:latest
    container_name: ${YUXI_CONTAINER_PREFIX:-}paddlex-ocr
    profiles:
      - all
    volumes:
      - ${YUXI_DATA_DIR:-./docker/volumes}/paddlex:/paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
